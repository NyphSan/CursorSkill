name: orgops-loop

on:
  schedule:
    # DIGEST cron 约 11:04+08；本环 11:20+08
    - cron: "20 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  cycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Standing branch
        run: |
          git checkout -B orgops-standing
          git fetch origin CursorSkillSearch:refs/remotes/origin/CursorSkillSearch || true

      - name: Run OrgOps cycle
        env:
          CURSOR_MODEL: github-actions
          CURSOR_SESSION_ID: ${{ github.run_id }}
        run: bash scripts/orgops-loop.sh

      - name: Commit and open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "orgops-loop"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SKILL_MAP.md skills projects/OrgOps/records/reports projects/OrgOps/records/metrics || true
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "orgops-loop: $(date -u +%F) cycle"
          git push -u origin orgops-standing
          if gh pr list --head orgops-standing --base main --json number --jq 'length' | grep -qx 0; then
            gh pr create --base main --head orgops-standing \
              --title "orgops-loop: standing skill cycle" \
              --body "长期环自动升格。合 main 仍须人工确认。见 projects/OrgOps/LOOP.md"
          fi

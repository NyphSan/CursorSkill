name: verify-collected-skills

# schedule 只在默认分支生效。本 PR 合进 main 后才会每天跑。
# 在 PR 上 push 时也会跑一次，用来验脚本。
on:
  schedule:
    - cron: "20 4 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/verify-collected-skills.py"
      - "Skill/VERIFY.md"
      - ".github/workflows/verify-collected-skills.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch scout branch
        run: git fetch origin CursorSkillSearch:CursorSkillSearch
      - name: Run verifier
        run: python3 scripts/verify-collected-skills.py --ref CursorSkillSearch
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: verify-report
          path: records/verify/
          if-no-files-found: error
